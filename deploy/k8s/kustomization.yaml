apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 所有资源统一归属 kkfileview 命名空间
namespace: kkfileview

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service-clusterip.yaml
  - service-nodeport.yaml

