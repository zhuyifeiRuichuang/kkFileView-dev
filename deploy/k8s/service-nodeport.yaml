apiVersion: v1
kind: Service
metadata:
  name: kkfileview-nodeport
  namespace: kkfileview
  labels:
    app: kkfileview
spec:
  type: NodePort
  selector:
    app: kkfileview
  ports:
    - name: http
      port: 8012
      targetPort: 8012
      # 固定 NodePort（可选，范围是 30000-32767）；留空则由集群自动分配
      nodePort: 30812
      protocol: TCP
