apiVersion: apps/v1
kind: Deployment
metadata:
  name: kkfileview
  namespace: kkfileview
  labels:
    app: kkfileview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kkfileview
  template:
    metadata:
      labels:
        app: kkfileview
    spec:
      containers:
        - name: kkfileview
          image: ghcr.io/zhuyifeiruichuang/kkfileview:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8012
              name: http
          volumeMounts:
            - name: config
              mountPath: /opt/kkfileview/config/application.properties
              subPath: application.properties
          # 启动探针：覆盖 JVM + LibreOffice 初始化较慢的场景（最长约 180s 宽限），
          # 在 startupProbe 成功前 livenessProbe 不介入，避免启动期被误杀重启。
          startupProbe:
            httpGet:
              path: /
              port: 8012
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /
              port: 8012
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8012
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
      volumes:
        - name: config
          configMap:
            name: kkfileview-config
            items:
              - key: application.properties
                path: application.properties
