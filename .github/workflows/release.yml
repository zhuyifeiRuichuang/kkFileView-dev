name: Release

# 推送 semver tag（如 v5.0.2）时触发全量发布。严格线性流程：
#   1) 解析版本号（去掉前缀 v）
#   2) Maven 打包，产出 tar.gz 发行包 + 独立可运行 jar（先得 jar）
#   3) 确保基础镜像 :<版本> 存在（优先用 imagetools 把 :latest 别名复用，避免重复构建；
#      若 :latest 尚不存在则回退为从源码构建并打 :<版本> 与 :latest）
#   4) 多架构构建并推送最终镜像 :<版本> 与 :latest（FROM 基础镜像 + ADD jar 发行包）
#   5) 冒烟测试刚发布的真实镜像（docker run 真实镜像，健康检查 / 200 + 启动日志标志），跑完即销毁
#   6) 创建 GitHub Release，上传 tar.gz 与 jar 两类制品
#
# 缓存策略：inline cache，不发布额外的 :cache tag。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 Release
  packages: write   # 推送 GHCR 镜像

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve version & image vars
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kkfileview-base" >> "$GITHUB_ENV"
          echo "FINAL_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kkfileview" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 步骤 2：先打包代码，得到 jar / tar.gz 发行包（最终镜像会 ADD 该发行包）
      - name: Build with Maven (package)
        run: mvn -B package -Dmaven.test.skip=true --file pom.xml

      # 步骤 3：确保基础镜像 :<版本> 存在。
      # 复用优先：若 build-base.yml 已把 :latest 推上 GHCR，则 imagetools 把 :latest 同时别名为 :<版本> 和 :latest
      #（不重复构建 LibreOffice，且保证二者在 GHCR 里显示为同一个镜像）。
      # 若 :latest 缺失则回退为从源码构建，并打 :<版本> 与 :latest。
      - name: Ensure base image :${VERSION} exists
        run: |
          set -euo pipefail
          if docker buildx imagetools create \
               --tag "${BASE_IMAGE}:${VERSION}" \
               --tag "${BASE_IMAGE}:latest" \
               "${BASE_IMAGE}:latest" 2>/dev/null; then
            echo "OK reuse :latest as :${VERSION} and refresh :latest alias (no rebuild)"
          else
            echo "WARN :latest missing, building base from source"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file building/base/Dockerfile \
              --tag "${BASE_IMAGE}:${VERSION}" \
              --tag "${BASE_IMAGE}:latest" \
              --cache-from type=registry,ref="${BASE_IMAGE}:latest" \
              --cache-to type=inline \
              --push \
              building/base
          fi

      # 步骤 4：构建最终镜像（FROM 版本化基础镜像 + ADD 上一步的 jar 发行包），多架构推送
      - name: Build and push final image (amd64 + arm64)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file building/final/Dockerfile \
            --build-arg KK_VERSION="${VERSION}" \
            --tag "${FINAL_IMAGE}:${VERSION}" \
            --tag "${FINAL_IMAGE}:latest" \
            --cache-from type=registry,ref="${FINAL_IMAGE}:latest" \
            --cache-to type=inline \
            --push \
            .

      # 步骤 5：部署测试 —— 拉取刚发布的真实最终镜像并运行，验证服务可正常启动并响应。
      # 仅做健康检查（/ 返回 200 + 启动日志标志），轻量稳定；跑完即销毁。
      # 位于「推送镜像」之后、「创建 Release」之前：镜像不健康则流程失败，不会产出绿色 Release。
      - name: Smoke test published image
        run: |
          set -euo pipefail
          IMG="${FINAL_IMAGE}:${VERSION}"
          echo "Pulling ${IMG}"
          docker pull "${IMG}"
          CID=$(docker run -d --rm -p 8012:8012 "${IMG}")
          trap 'docker stop "${CID}" >/dev/null 2>&1 || true' EXIT
          ready=false
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8012/ >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "ERROR: kkFileView did not become ready within 240s"
            docker logs "${CID}" || true
            exit 1
          fi
          echo "OK: GET / returned 200"
          if docker logs "${CID}" 2>&1 | grep -qi "Started"; then
            echo "OK: startup completion flag found in logs"
          else
            echo "WARN: 'Started' flag not found in logs (service responded 200, treating as OK)"
          fi

      # 步骤 6：创建 GitHub Release，上传 tar.gz 与 jar 两类制品
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: kkFileView ${{ env.VERSION }}
          files: |
            server/target/kkFileView-*.tar.gz
            server/target/kkFileView-*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
