name: Release

# 推送 semver tag（如 v5.0.2）时触发全量发布：
#   1) 解析版本号（去掉前缀 v）
#   2) 确保基础镜像 :<版本> 存在（优先用 imagetools 把 :latest 别名复用，避免重复构建；
#      若 :latest 尚不存在则回退为从源码构建并打 :<版本> 与 :latest）
#   3) Maven 打包，产出 tar.gz 发行包 + 独立可运行 jar
#   4) 多架构构建并推送最终镜像 :<版本> 与 :latest
#   5) 创建 GitHub Release，上传 tar.gz 与 jar 两类制品
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 Release
  packages: write   # 推送 GHCR 镜像

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version & image vars
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kkfileview-base" >> "$GITHUB_ENV"
          echo "FINAL_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kkfileview" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 避免重复构建：优先把已有的 :latest 基础镜像直接别名成 :<版本>（多架构 manifest 复用，零层重推）
      - name: Ensure base image :${VERSION} exists
        run: |
          set -euo pipefail
          if docker buildx imagetools create --tag "${BASE_IMAGE}:${VERSION}" "${BASE_IMAGE}:latest" 2>/dev/null; then
            echo "OK reuse :latest as :${VERSION} (no rebuild)"
          else
            echo "WARN :latest missing, building base from source"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file building/base/Dockerfile \
              --tag "${BASE_IMAGE}:${VERSION}" \
              --tag "${BASE_IMAGE}:latest" \
              --cache-from type=registry,ref="${BASE_IMAGE}:cache" \
              --cache-to type=registry,ref="${BASE_IMAGE}:cache",mode=max \
              --push \
              building/base
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven (package)
        run: mvn -B package -Dmaven.test.skip=true --file pom.xml

      - name: Build and push final image (amd64 + arm64)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file building/final/Dockerfile \
            --build-arg KK_VERSION="${VERSION}" \
            --tag "${FINAL_IMAGE}:${VERSION}" \
            --tag "${FINAL_IMAGE}:latest" \
            --cache-from type=registry,ref="${FINAL_IMAGE}:cache" \
            --cache-to type=registry,ref="${FINAL_IMAGE}:cache",mode=max \
            --push \
            .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: kkFileView ${{ env.VERSION }}
          files: |
            server/target/kkFileView-*.tar.gz
            server/target/kkFileView-*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
