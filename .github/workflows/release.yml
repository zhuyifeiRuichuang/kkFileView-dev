name: Release

# 推送 semver tag（如 v5.0.2）时触发全量发布。严格线性流程（顺序锁死）：
#   1) 解析版本号（去掉前缀 v）
#   2) Maven 打包，产出 tar.gz 发行包 + 独立可运行 jar（先得 jar）
#   3) 构建基础镜像 :latest（每次发版都从源码重建，--cache-from 命中未变层，
#      确保基于当前代码，消除与 build-base.yml 并行的竞态；base 不绑版本号）
#   4) 多架构构建并推送最终镜像 :<版本> 与 :latest（FROM 基础镜像 :latest + ADD jar 发行包）
#   5) 冒烟测试刚发布的真实镜像（docker run 真实镜像，健康检查 / 200），跑完即销毁
#   6) 上传 tar.gz 与 jar 制品为 workflow artifact（供 publish job 使用）
#   7) 自动调用 Deploy Test（workflow_call）用 deploy/ 真实部署文件验证
#   8) 部署测试通过后，由独立 publish job 创建 GitHub Release 并上传制品
#
# 顺序要点：打包 → 基础镜像 → 最终镜像 → 冒烟 → 部署测试 → 发布 Release。
# 只有「部署测试通过」后才会创建 GitHub Release（制品发布），测试失败不对外发布。
#
# 缓存策略：inline cache，不发布额外的 :cache tag。
# 基础镜像策略：不区分版本，只保留 :latest；发版时 release.yml 重建（确保基于当前代码），
# 非发版场景（定时补丁/变更）由 build-base.yml 重建并级联 rebuild-final 更新 final:latest。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 Release
  packages: write   # 推送 GHCR 镜像

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve version & image vars
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kkfileview-base" >> "$GITHUB_ENV"
          echo "FINAL_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kkfileview" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 步骤 2：先打包代码，得到 jar / tar.gz 发行包（最终镜像会 ADD 该发行包）
      - name: Build with Maven (package)
        run: mvn -B package -Dmaven.test.skip=true --file pom.xml

      # 步骤 3：构建基础镜像 :latest（每次发版都从源码重建，确保基于当前代码）。
      # --cache-from 命中 GHCR 上 :latest 的 inline cache，未变层秒过，只重 build 变化层。
      # base 不区分版本，只 :latest，不绑发版版本号。
      # 每次发版都重建，消除「推 tag 与 build-base.yml 并行时命中旧 base」的竞态。
      - name: Build base image :latest (from source, with cache)
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file building/base/Dockerfile \
            --tag "${BASE_IMAGE}:latest" \
            --cache-from type=registry,ref="${BASE_IMAGE}:latest" \
            --cache-to type=inline \
            --provenance=false \
            --push \
            --metadata-file base-meta.json \
            building/base

      # 步骤 4：构建最终镜像（FROM 基础镜像 :latest + ADD 上一步的 jar 发行包），多架构推送
      # 最终镜像保留 :<版本> 与 :latest 两个 tag；基础镜像只用 :latest，不区分版本。
      - name: Build and push final image (amd64 + arm64)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file building/final/Dockerfile \
            --tag "${FINAL_IMAGE}:${VERSION}" \
            --tag "${FINAL_IMAGE}:latest" \
            --cache-from type=registry,ref="${FINAL_IMAGE}:latest" \
            --cache-to type=inline \
            --provenance=false \
            --push \
            --metadata-file final-meta.json \
            .

      # 步骤 5：部署测试 —— 拉取刚发布的真实最终镜像并运行，验证服务可正常启动并响应。
      # 仅做健康检查（/ 返回 200 + 启动日志标志），轻量稳定；跑完即销毁。
      # 位于「推送镜像」之后、「创建 Release」之前：镜像不健康则流程失败，不会产出绿色 Release。
      - name: Smoke test published image
        run: |
          set -euo pipefail
          IMG="${FINAL_IMAGE}:${VERSION}"
          echo "Pulling ${IMG}"
          docker pull "${IMG}"
          CID=$(docker run -d --rm -p 8012:8012 "${IMG}")
          trap 'docker stop "${CID}" >/dev/null 2>&1 || true' EXIT
          ready=false
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8012/ >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "ERROR: kkFileView did not become ready within 240s"
            docker logs "${CID}" || true
            exit 1
          fi
          echo "OK: GET / returned 200"
          if docker logs "${CID}" 2>&1 | grep -qi "Started"; then
            echo "OK: startup completion flag found in logs"
          else
            echo "WARN: 'Started' flag not found in logs (service responded 200, treating as OK)"
          fi

      # 步骤 6：记录 base 与 final 镜像的 digest，生成 images.txt 作为发版制品。
      # 两镜像都已在 GHCR（步骤 3/4 推送），此处固化 digest 供 Release 引用，
      # 实现「base 和 final 都作为制品输出到 GitHub」。digest 取自 buildx --metadata-file。
      - name: Record image digests
        run: |
          set -euo pipefail
          BASE_DIGEST=$(python3 -c "import json;print(json.load(open('base-meta.json'))['containerimage.digest'])")
          FINAL_DIGEST=$(python3 -c "import json;print(json.load(open('final-meta.json'))['containerimage.digest'])")
          {
            echo "# Container images published for kkFileView ${VERSION}"
            echo ""
            echo "## Base image (runtime: Ubuntu + JRE 21 + LibreOffice + CJK fonts)"
            echo "${BASE_IMAGE}:latest@${BASE_DIGEST}"
            echo ""
            echo "## Final image (base + kkFileView application)"
            echo "${FINAL_IMAGE}:${VERSION}@${FINAL_DIGEST}"
            echo "${FINAL_IMAGE}:latest@${FINAL_DIGEST}   (same image as :${VERSION})"
          } > images.txt
          echo "===== images.txt ====="
          cat images.txt

      # 步骤 7：上传发行制品（tar.gz + jar + images.txt）为 workflow artifact，供 publish job 发布 Release 使用。
      # 不再在此处创建 GitHub Release——改为在 deploy-test 通过后由独立的 publish job 创建，
      # 保证「部署测试通过才发布制品」。
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kkfileview-dist
          path: |
            server/target/kkFileView-*.tar.gz
            server/target/kkFileView-*.jar
            images.txt
          if-no-files-found: error

  # 步骤 7：发布完成后，自动调用 Deploy Test 工作流验证真实部署文件可用性。
  # 通过 workflow_call 复用 deploy-test.yml；只要 release（含镜像推送）成功，即自动测试。
  deploy-test:
    name: Deploy Test (triggered by release)
    needs: release
    uses: ./.github/workflows/deploy-test.yml
    permissions:
      contents: read
      packages: read   # 拉取 GHCR 上的镜像

  # 步骤 8：部署测试通过后才创建 GitHub Release 并上传制品。
  # needs: deploy-test 保证「测试通过才发布」；制品来自 release job 上传的 artifact。
  publish:
    name: Publish Release
    needs: deploy-test
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # 创建 Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve version & image vars
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kkfileview-base" >> "$GITHUB_ENV"
          echo "FINAL_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kkfileview" >> "$GITHUB_ENV"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: kkfileview-dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: kkFileView ${{ env.VERSION }}
          body: |
            ## Container images
            - Base: `${{ env.BASE_IMAGE }}:latest`
            - Final: `${{ env.FINAL_IMAGE }}:${{ env.VERSION }}` / `:latest`

            Image digests (sha256): see `images.txt` attachment.
          files: |
            dist/kkFileView-*.tar.gz
            dist/kkFileView-*.jar
            dist/images.txt
          generate_release_notes: true
          skip_if_release_exists: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
