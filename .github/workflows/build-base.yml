name: Build Base Image

# 仅在基础镜像相关文件（building/base/**）变更时才重建并推送基础镜像 :latest
# 避免每次代码变更都重 build 庞大的 LibreOffice 基础镜像（避免重复构建）
on:
  push:
    paths:
      - 'building/base/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set lowercased image vars
        run: |
          echo "BASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kkfileview-base" >> "$GITHUB_ENV"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建并推送基础镜像 :latest。
      # 缓存策略：使用 inline cache（内嵌在 :latest 镜像中），不再额外发布 :cache tag。
      # 这样 GHCR 里只出现 :latest 一个 tag，避免污染。
      # --provenance=false 禁用 BuildKit 默认生成的 SLSA provenance 附加 manifest，
      # 避免在 GHCR OS/Arch 列表里出现多余的 unknown/unknown 条目。
      - name: Build and push base image :latest (amd64 + arm64)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file building/base/Dockerfile \
            --tag "${BASE_IMAGE}:latest" \
            --cache-from type=registry,ref="${BASE_IMAGE}:latest" \
            --cache-to type=inline \
            --provenance=false \
            --push \
            building/base
